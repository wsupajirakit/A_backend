# nginx example for the A backend. Web root = <project>/public
server {
    listen 443 ssl http2;
    server_name api.example.com www.example.com;
    root /var/www/a_backend/public;
    index index.php;

    # Mobile API front controller
    location ^~ /api/v1/ {
        try_files $uri /api/index.php$is_args$args;
    }

    # Legacy admin panel lives outside the web root
    location ^~ /admin/ {
        alias /var/www/a_backend/admin/;
        location ~ ^/admin/(assets/php-function|assets/message_var|data|webservice/email_tmpl)/ { deny all; }
        location ~ ^/admin/(bootstrap|header|footer|sidenav|topnav|check_user_session|check_user_insession)\.php$ { deny all; }
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    # Uploads: static files only
    location ^~ /rsc/ {
        location ~ \.(php\d?|phtml|phar|html?|svg|js)$ { deny all; }
        add_header X-Content-Type-Options nosniff;
    }

    # Include-only files and templates
    location ~ ^/(initialize|header|footer)\.php$ { deny all; }
    location ~ ^/__tmpl_.*\.html$ { deny all; }
    location ~ /\. { deny all; }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
