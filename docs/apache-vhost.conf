# Apache example. public/.htaccess handles the /api/v1 rewrite (AllowOverride All).
<VirtualHost *:443>
    ServerName www.example.com
    DocumentRoot /var/www/a_backend/public

    <Directory /var/www/a_backend/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Legacy admin panel lives outside the web root.
    Alias /admin /var/www/a_backend/admin
    <Directory /var/www/a_backend/admin>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
